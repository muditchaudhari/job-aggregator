[project]
name = "job-aggregator-platform"
version = "0.1.0"
description = "Self-learning job aggregation platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Required by pydantic's EmailStr, used in the profile schema.
    "email-validator>=2.2",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery[redis]>=5.4",
    # The http2 extra pulls in `h2`. Requesting HTTP/2 without it is a hard
    # error at client construction, not a downgrade (see scrapers/fetcher.py).
    "httpx[http2,brotli,zstd]>=0.28",
    "playwright>=1.49",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "python-dateutil>=2.9",
    "tenacity>=9.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.57"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL/Redis",
    "e2e: full pipeline test",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    # FastAPI's dependency injection is function calls in defaults, by design.
    "B008",
    # En/em dashes and typographic punctuation are used deliberately in prose
    # and in salary-format test fixtures ("£45k–£60k"), where the dash is the
    # thing under test.
    "RUF001",
    "RUF002",
    "RUF003",
    # PEP 695 type parameters are not yet well supported by the Pydantic and
    # SQLAlchemy plugins for mypy; the explicit Generic base is the safer form.
    "UP046",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
