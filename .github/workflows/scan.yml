name: Scan job portals

# Every 30 minutes — at :13 and :43, not :00 and :30. Two things worth knowing
# about GitHub's cron:
#
#  * It is best-effort, and it drops runs under load rather than delaying
#    them. On the hour and half-hour are the most congested slots on the
#    shared queue, and a `*/30` schedule sat there produced about six runs a
#    day instead of forty-eight. Off-peak minutes are honoured far more often.
#  * A scheduled workflow is DISABLED automatically after 60 days without
#    repository activity. The "heartbeat" step at the end pushes a one-line
#    commit once a day, which counts as activity and keeps the schedule alive
#    without your having to remember anything.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch: # so you can also trigger a scan by hand from the Actions tab
    inputs:
      test_email:
        description: "Send a test alert instead of scanning (checks delivery works)"
        type: boolean
        default: false
      forget:
        description: "Requisition ids to forget before scanning, space separated (replays their alert)"
        type: string
        default: ""

# A slow scan must never overlap with the next scheduled one: two processes
# writing the same SQLite database would fight for the write lock, and both
# could email the same posting.
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write # only for the heartbeat commit
  pages: write    # the health dashboard
  id-token: write # deploy-pages authenticates with an OIDC token, not a PAT

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Where the dashboard deploys to. GitHub only accepts a Pages deployment
    # from a job bound to this environment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      # No Postgres and no Redis on a runner. SQLite holds the state and the
      # LLM budget falls back to a per-process counter — see app/llm/budget.py.
      DATABASE_URL: sqlite+pysqlite:///${{ github.workspace }}/state/jobs.db
      ENVIRONMENT: production
      LOG_JSON: "true"
      LOG_LEVEL: INFO

      # Delivery over HTTPS rather than SMTP: GitHub blocks outbound SMTP
      # ports on hosted runners, so a mail server would never connect.
      NOTIFY_CHANNELS: resend
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ vars.RESEND_FROM || 'onboarding@resend.dev' }}

      # Optional. Without a key the LLM tier is simply skipped and the four
      # deterministic tiers do the work, which is where all of the configured
      # portals are served from today.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_ENABLED: ${{ secrets.GEMINI_API_KEY != '' }}

      # Politeness. A datacentre IP is treated with more suspicion than a home
      # one, so ask for less than a local run does.
      SCRAPE_REQUESTS_PER_MINUTE_PER_DOMAIN: "20"
      SCRAPE_RESPECT_ROBOTS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The database is state, not source: it holds which postings have already
      # been seen, so only genuinely new ones are emailed. It is cached rather
      # than committed because it grows to megabytes and a commit every 30
      # minutes would bloat the repository past any use.
      #
      # If the cache is ever evicted the run rebuilds from scratch and records
      # a silent BASELINE — no flood of mail about jobs you have already seen.
      # That property is what makes a cache safe to rely on here.
      - name: Restore scan state
        id: state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: scan-state-${{ github.run_id }}
          restore-keys: scan-state-

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The gemini extra carries google-genai. Without it a GEMINI_API_KEY
          # would be accepted and then fail at the first call.
          pip install -e ".[gemini]"
          # Needed only by portals that render client-side. If this fails the
          # run still succeeds: those portals report a transient failure and
          # every API-backed portal is unaffected.
          python -m playwright install chromium || echo "::warning::Playwright install failed; render tier unavailable"

      # Delivery is the one link a scan cannot prove on demand: it only fires
      # when a new posting clears the threshold, which can be days away.
      - name: Send test email
        if: inputs.test_email
        run: |
          mkdir -p state
          python -m app.cli test-email

      # Deliberate replay: drop these postings so the scan below rediscovers
      # them and delivers their alert again. Used after fixing something that
      # was wrong in what was already sent.
      - name: Forget postings
        if: ${{ !inputs.test_email && inputs.forget != '' }}
        # Through the environment, never interpolated into the script body:
        # `${{ inputs.x }}` is substituted before bash sees the line, so the
        # input would be executable text rather than an argument.
        env:
          FORGET_IDS: ${{ inputs.forget }}
        run: |
          mkdir -p state
          python -m app.cli forget $FORGET_IDS

      - name: Scan and notify
        if: ${{ !inputs.test_email }}
        run: |
          mkdir -p state
          # Serial, deliberately. Parallelism exists for the interactive case,
          # where someone is watching a progress bar; here nobody is, and
          # SQLite has a single write lock for the whole file. Four threads
          # contend for it and the slow boards lose. A serial pass costs a few
          # extra minutes of a runner that is free and idle either way.
          python -m app.cli run --notify --jobs 1 --top 25

      # Written straight into the published directory. Copying it there
      # afterwards meant a silent `cp` failure left the dashboard's link to it
      # pointing at nothing.
      - name: Build report
        if: ${{ always() && !inputs.test_email }}
        run: |
          mkdir -p site
          python -m app.cli results --html site/results.html || true

      # A browsable copy of the same results the email contains, in case you
      # want to look before the mail arrives.
      - name: Upload report
        if: ${{ always() && !inputs.test_email }}
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: site/results.html
          retention-days: 3
          if-no-files-found: ignore

      # A static page that answers "is everything still working" without a
      # trip through the Actions log. Rebuilt from the database after every
      # scan and published to GitHub Pages, so refreshing the page shows the
      # latest run. No commits: it deploys straight from this job.
      - name: Build dashboard
        if: ${{ always() && !inputs.test_email }}
        run: python -m app.cli dashboard --out site

      - name: Upload dashboard
        if: ${{ always() && !inputs.test_email }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard
        if: ${{ always() && !inputs.test_email }}
        id: deployment
        uses: actions/deploy-pages@v4

      # Skipped on a test-email run: that run does not scan, so saving would
      # replace a good cache entry with one that has seen nothing.
      - name: Save scan state
        if: ${{ always() && !inputs.test_email }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: scan-state-${{ github.run_id }}

      # Keeps the schedule from being auto-disabled at 60 days. Once a day is
      # ample, and committing every run would add 48 commits a day for nothing.
      - name: Heartbeat
        if: always()
        run: |
          today="$(date -u +%F)"
          if [ "$(cat .github/last-run.txt 2>/dev/null | cut -d' ' -f1)" = "$today" ]; then
            echo "already recorded a run today; nothing to commit"
            exit 0
          fi
          echo "$today $(date -u +%T) UTC" > .github/last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-run.txt
          git commit -m "Record scan heartbeat for $today [skip ci]"
          # Another run may have pushed since checkout; rebase rather than fail.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
